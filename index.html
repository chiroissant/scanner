<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>レシート全自動スキャナー</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px; font-family: -apple-system, sans-serif;
      background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center;
    }
    h2 { margin: 8px 0; font-size: 1.1rem; }
    .box {
      position: relative; width: 100%; max-width: 380px; aspect-ratio: 3/4;
      border-radius: 16px; overflow: hidden; background: black;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    .guide {
      position: absolute; top: 10%; left: 10%; right: 10%; bottom: 10%;
      border: 2px dashed rgba(255,255,255,0.7); border-radius: 12px;
      box-shadow: 0 0 0 2000px rgba(0,0,0,0.45); pointer-events: none;
      display: flex; align-items: center; justify-content: center;
    }
    .guide.paused { border-color: rgba(239, 68, 68, 0.8); }
    .gauge { width: 80px; height: 80px; opacity: 0; transition: opacity 0.2s; }
    .gauge.active { opacity: 1; }
    .flash { position: absolute; top:0; left:0; width:100%; height:100%; background: white; opacity: 0; pointer-events: none; }
    .flashing { animation: fl 0.3s ease-out; }
    @keyframes fl { 0% { opacity: 0.9; } 100% { opacity: 0; } }

    .pause-badge {
      position: absolute; top: 12px; right: 12px;
      background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 20px;
      font-size: 0.85rem; font-weight: bold; border: 1px solid rgba(255,255,255,0.3);
      display: flex; align-items: center; gap: 6px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
    .dot.paused { background: #ef4444; }

    #status {
      margin-top: 14px; font-size: 0.95rem; font-weight: bold; min-height: 2.8em;
      text-align: center; color: #38bdf8; line-height: 1.4; padding: 0 8px;
    }
    
    .btn-group {
      display: flex; gap: 10px; width: 100%; max-width: 380px; margin-top: 10px;
    }
    .btn {
      flex: 1; padding: 14px; border: none; border-radius: 24px;
      font-size: 0.95rem; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    .start-btn { background: #2563eb; color: white; width: 100%; max-width: 380px; }
    .toggle-pause-btn { background: #334155; color: white; border: 1px solid #475569; }
    .toggle-pause-btn.is-paused { background: #16a34a; }
    .manual-btn { background: #0284c7; color: white; }

    canvas { display: none; }
  </style>
</head>
<body>
  <h2>🧾 かざすだけ全自動スキャナー</h2>
  
  <div class="box" id="viewBox">
    <video id="video" autoplay playsinline muted></video>
    <div class="guide" id="guide">
      <svg class="gauge" id="gauge" viewBox="0 0 36 36">
        <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3" />
        <path id="gaugeProg" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" />
      </svg>
    </div>
    <div class="pause-badge">
      <span class="dot" id="statusDot"></span>
      <span id="badgeText">監視中</span>
    </div>
    <div class="flash" id="flash"></div>
  </div>

  <div id="status">下のボタンを押してスキャナーを起動</div>
  
  <button class="btn start-btn" id="startBtn" onclick="initCam()">📹 スキャナーを起動</button>
  
  <div class="btn-group" id="ctrlGroup" style="display: none;">
    <button class="btn toggle-pause-btn" id="pauseBtn" onclick="togglePause()">⏸️ 一時停止</button>
    <button class="btn manual-btn" id="manualBtn" onclick="forceCapture()">📸 今すぐ撮影</button>
  </div>

  <canvas id="motionCv" width="64" height="64"></canvas>
  <canvas id="fullCv"></canvas>

  <script>
    // ★★★ あなたのGASのURLを貼り付けてください ★★★
    const GAS_URL = "https://script.google.com/macros/s/AKfycbybO55lI-Fr5PGa7M4ixGIjKQ0hNGzlVcqzlBsBs2-qYAW3WmwL_eZSZT0kPwFcpiSCnQ/exec";

    const video = document.getElementById('video');
    const statusDiv = document.getElementById('status');
    const flash = document.getElementById('flash');
    const gauge = document.getElementById('gauge');
    const gaugeProg = document.getElementById('gaugeProg');
    const guide = document.getElementById('guide');
    const startBtn = document.getElementById('startBtn');
    const ctrlGroup = document.getElementById('ctrlGroup');
    const pauseBtn = document.getElementById('pauseBtn');
    const statusDot = document.getElementById('statusDot');
    const badgeText = document.getElementById('badgeText');
    const mCv = document.getElementById('motionCv');
    const mCtx = mCv.getContext('2d', { willReadFrequently: true });
    const fCv = document.getElementById('fullCv');

    let prevData = null, steadyTime = 0, isBusy = false;
    let isPaused = false;
    let countdownTimer = null;
    const TARGET = 800, THRESHOLD = 9;

    async function initCam() {
      startBtn.style.display = 'none';
      ctrlGroup.style.display = 'flex';
      statusDiv.textContent = "カメラ起動中...";
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        statusDiv.textContent = "レシートにかざして手を止めてください";
        setInterval(checkMotion, 100);
      } catch (err) {
        startBtn.style.display = 'block';
        ctrlGroup.style.display = 'none';
        statusDiv.textContent = "カメラエラー: " + err.message;
      }
    }

    function setPauseState(paused) {
      isPaused = paused;
      steadyTime = 0;
      gauge.classList.remove('active');
      gaugeProg.setAttribute('stroke-dasharray', '0, 100');

      if (isPaused) {
        pauseBtn.textContent = "▶️ 自動撮影を再開";
        pauseBtn.classList.add('is-paused');
        statusDot.classList.add('paused');
        badgeText.textContent = "停止中";
        guide.classList.add('paused');
      } else {
        if (countdownTimer) {
          clearInterval(countdownTimer);
          countdownTimer = null;
        }
        pauseBtn.textContent = "⏸️ 一時停止";
        pauseBtn.classList.remove('is-paused');
        statusDot.classList.remove('paused');
        badgeText.textContent = "監視中";
        guide.classList.remove('paused');
        statusDiv.style.color = "#38bdf8";
        statusDiv.textContent = "レシートにかざして手を止めてください";
      }
    }

    function togglePause() {
      if (!video.srcObject) return;
      if (countdownTimer) {
        clearInterval(countdownTimer);
        countdownTimer = null;
      }
      setPauseState(!isPaused);
      if (isPaused) {
        statusDiv.style.color = "#f87171";
        statusDiv.textContent = "⏸️ 一時停止中（再開ボタンを押してください）";
      }
    }

    function startCooldownTimer(sec) {
      setPauseState(true);
      if (countdownTimer) clearInterval(countdownTimer);
      let remain = sec;
      statusDiv.style.color = "#f87171";
      statusDiv.innerHTML = `⏳ AIの利用枠回復待ちです<br><span style="font-size:1.2rem;color:#facc15;">あと ${remain} 秒</span> で自動再開します`;

      countdownTimer = setInterval(() => {
        remain--;
        if (remain > 0) {
          statusDiv.innerHTML = `⏳ AIの利用枠回復待ちです<br><span style="font-size:1.2rem;color:#facc15;">あと ${remain} 秒</span> で自動再開します`;
        } else {
          clearInterval(countdownTimer);
          countdownTimer = null;
          setPauseState(false);
          statusDiv.style.color = "#4ade80";
          statusDiv.textContent = "✨ 回復しました！手を止めて撮影してください";
        }
      }, 1000);
    }

    function checkMotion() {
      if (isBusy || isPaused || countdownTimer || !video.videoWidth) return;
      mCtx.drawImage(video, 0, 0, 64, 64);
      const curr = mCtx.getImageData(0, 0, 64, 64).data;
      if (prevData) {
        let diff = 0;
        for (let i = 0; i < curr.length; i += 4) diff += Math.abs(curr[i] - prevData[i]);
        const avg = diff / (64 * 64);

        if (avg < THRESHOLD) {
          steadyTime += 100;
          gauge.classList.add('active');
          gaugeProg.setAttribute('stroke-dasharray', `${Math.min(100, Math.round(steadyTime / TARGET * 100))}, 100`);
          if (steadyTime >= TARGET) capture();
        } else {
          steadyTime = 0;
          gauge.classList.remove('active');
          gaugeProg.setAttribute('stroke-dasharray', `0, 100`);
        }
      }
      prevData = curr;
    }

    function forceCapture() {
      if (isBusy || countdownTimer || !video.videoWidth) return;
      capture();
    }

    async function capture() {
      if (isBusy || countdownTimer) return;
      isBusy = true;
      flash.classList.add('flashing');
      setTimeout(() => flash.classList.remove('flashing'), 300);
      if (navigator.vibrate) navigator.vibrate(100);

      gauge.classList.remove('active');
      statusDiv.style.color = "#eab308";
      statusDiv.textContent = "⚡ AI解析＆スプシ保存中...";

      // ★軽量化：画像サイズを最大750px、品質0.55に圧縮（無料枠のデータ上限を消費しない設定）
      let w = video.videoWidth, h = video.videoHeight;
      const max = 750;
      if (w > h && w > max) { h = Math.round(h * max / w); w = max; }
      else if (h > max) { w = Math.round(w * max / h); h = max; }
      fCv.width = w; fCv.height = h;
      fCv.getContext('2d').drawImage(video, 0, 0, w, h);
      const b64 = fCv.toDataURL('image/jpeg', 0.55);

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ image: b64 })
        });
        const result = await res.json();
        if (result.success) {
          statusDiv.style.color = "#4ade80";
          statusDiv.textContent = `✅ [${result.store}] 保存完了！`;
        } else {
          const errStr = String(result.error || "");
          if (errStr.toLowerCase().includes("quota") || errStr.toLowerCase().includes("retry in")) {
            const match = errStr.match(/retry in\s+([\d\.]+)\s*s/i);
            const sec = match ? Math.ceil(parseFloat(match[1])) : 35;
            startCooldownTimer(sec);
          } else {
            statusDiv.style.color = "#f87171";
            statusDiv.textContent = "エラー: " + errStr;
            setPauseState(true);
          }
        }
      } catch (err) {
        statusDiv.style.color = "#f87171";
        statusDiv.textContent = "通信エラー: " + err.message;
        setPauseState(true);
      }

      setTimeout(() => {
        steadyTime = 0;
        isBusy = false;
        if (!isPaused && !countdownTimer) {
          statusDiv.style.color = "#38bdf8";
          statusDiv.textContent = "次のレシートにかざして手を止めてください";
        }
      }, 3000);
    }
  </script>
</body>
</html>
